			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
						shellScript = "if [ \"YES\" = \"$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED\" ]; then\n  echo \"Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \\\"YES\\\"\"\n  exit 0\nfi\n\n# Xcode Cloud (ci_post_clone.sh) pre-builds the Kotlin framework and drops a\n# marker file. When that marker is present, this phase must NOT invoke Gradle:\n# Xcode Cloud's xcodebuild runs with `-hideShellScriptEnvironment` (strips\n# JAVA_HOME/PATH) and has no JDK, so calling gradlew here would fail with\n# \"Unable to locate a Java Runtime\".\nMARKER=\"$SRCROOT/../sample/build/xcode-frameworks/.xcode-cloud-prebuild\"\nif [ -f \"$MARKER\" ]; then\n  echo \"Kotlin framework pre-built by ci_post_clone.sh (marker: $MARKER) - skipping Gradle.\"\n  exit 0\nfi\n\n# xcodebuild archive may run with -hideShellScriptEnvironment, which strips\n# JAVA_HOME and PATH. On macOS /usr/bin/java is often just a stub that reports\n# \"Unable to locate a Java Runtime\" even though `command -v java` succeeds, so\n# we verify java works functionally before trusting it, else discover a real JDK.\njava_works() {\n  \"$1\" -version >/dev/null 2>&1\n}\n\n# 1) Trust JAVA_HOME if it yields a working java.\nif [ -n \"$JAVA_HOME\" ] && [ -x \"$JAVA_HOME/bin/java\" ] && java_works \"$JAVA_HOME/bin/java\"; then\n  export PATH=\"$JAVA_HOME/bin:$PATH\"\nfi\n\n# 2) Prefer an existing working java on PATH.\nif ! (command -v java >/dev/null 2>&1 && java_works \"$(command -v java)\"); then\n  # 3) Let macOS locate an installed JDK (system or user level).\n  if [ -x /usr/libexec/java_home ]; then\n    JH=\"$(/usr/libexec/java_home 2>/dev/null || true)\"\n    if [ -n \"$JH\" ] && [ -x \"$JH/bin/java\" ] && java_works \"$JH/bin/java\"; then\n      export JAVA_HOME=\"$JH\"\n      export PATH=\"$JH/bin:$PATH\"\n    fi\n  fi\nfi\n\n# 4) Fall back to scanning known JDK install roots (system + user, covers\n#    actions/setup-java and Homebrew user casks that land under ~/Library).\nif ! (command -v java >/dev/null 2>&1 && java_works \"$(command -v java)\"); then\n  for ROOT in /Library/Java/JavaVirtualMachines \"$HOME/Library/Java/JavaVirtualMachines\"; do\n    for JDK in \"$ROOT\"/*/Contents/Home; do\n      if [ -x \"$JDK/bin/java\" ] && java_works \"$JDK/bin/java\"; then\n        export JAVA_HOME=\"$JDK\"\n        export PATH=\"$JDK/bin:$PATH\"\n        break 2\n      fi\n    done\n  done\nfi\n\n# 5) Final gate: if no working java, fail with a clear message.\nif ! (command -v java >/dev/null 2>&1 && java_works \"$(command -v java)\"); then\n  echo \"error: Unable to locate a working Java Runtime (JDK 21 required). On the build machine run 'brew install --cask temurin@21', or run this Kotlin build via ./gradlew separately.\" >&2\n  exit 1\nfi\n\ncd \"$SRCROOT/..\"\n./gradlew :sample:embedAndSignAppleFrameworkForXcode\n";
